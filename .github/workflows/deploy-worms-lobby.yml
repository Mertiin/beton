# Mirror Hotpot: on push to main, ask Coolify to rebuild/redeploy worms-lobby.
# Requires GitHub secrets (same pattern as Hotpot):
#   COOLIFY_TOKEN
#   COOLIFY_WORMS_WEBHOOK  (Deploy Webhook URL from the Coolify worms-lobby resource)
name: Deploy worms-lobby
on:
  push:
    branches: [main, master]
    paths:
      - "games/worms/**"
      - "games/worms-lobby/**"
      - "games/minesweeper/**"
      - "crates/beton/**"
      - "deploy/worms-lobby/**"
      - "docker-compose.worms-lobby.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/deploy-worms-lobby.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Coolify
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WORMS_WEBHOOK: ${{ secrets.COOLIFY_WORMS_WEBHOOK }}
        run: |
          # Prefer explicit webhook secret; fall back to known worms-lobby app UUID.
          WEBHOOK="${COOLIFY_WORMS_WEBHOOK:-https://ci.itknegaren.com/api/v1/deploy?uuid=u7myxjhp11ya96va0iqbrneh&force=true}"
          if [ -z "${COOLIFY_TOKEN}" ]; then
            echo "::error::COOLIFY_TOKEN not set — cannot deploy (Coolify Keys & Tokens → API token with deploy)"
            exit 1
          fi
          status=$(curl -s --request POST "${WEBHOOK}" \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --output response.txt --write-out '%{http_code}')
          echo "Coolify responded with HTTP $status"
          cat response.txt
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Coolify deploy failed with HTTP $status"
            exit 1
          fi
