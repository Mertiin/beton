[package]
name = "beton"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A small game engine with a short public API."
keywords = ["game", "engine", "wgpu", "graphics"]
categories = ["game-engines", "graphics"]
readme = "README.md"
publish = false

[features]
default = ["png", "jpeg", "wav", "vorbis"]
png = ["image/png"]
jpeg = ["image/jpeg"]
wav = ["rodio/hound"]
vorbis = ["rodio/lewton"]
physics = ["dep:rapier2d"]

[dependencies]
winit = { workspace = true }
wgpu = { workspace = true }
image = { workspace = true }
bytemuck = { workspace = true }
web-time = { workspace = true }
fontdue = { workspace = true }
yoga-rs = { workspace = true }
rapier2d = { workspace = true, optional = true }

[target.'cfg(all(not(target_arch = "wasm32"), windows))'.dependencies]
pollster = { workspace = true }
rodio = { workspace = true }
tungstenite = { workspace = true }
str0m = { workspace = true, features = ["wincrypto"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(windows)))'.dependencies]
pollster = { workspace = true }
rodio = { workspace = true }
tungstenite = { workspace = true }
str0m = { workspace = true, features = ["aws-lc-rs"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rodio = { workspace = true, features = ["wasm-bindgen"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
    "Response",
    "console",
    "WebSocket",
    "MessageEvent",
    "BinaryType",
    "CloseEvent",
    "ErrorEvent",
    "RtcPeerConnection",
    "RtcConfiguration",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
    "RtcSdpType",
    "RtcIceCandidate",
    "RtcIceCandidateInit",
    "RtcIceServer",
    "RtcPeerConnectionIceEvent",
    "RtcDataChannel",
    "RtcDataChannelEvent",
] }
console_error_panic_hook = { workspace = true }
